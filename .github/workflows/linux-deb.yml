name: Linux (.deb)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Gerar pacote .deb
        run: npm run deb
      - uses: actions/upload-artifact@v4
        with:
          name: entusiasta-linux
          path: dist/*.deb
